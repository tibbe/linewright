{%- extends "card_page.html" -%}
{%- block content %}
{%- if let Some(message) = message %}
<div class="alert{% if message.error %} alert-error{% endif %} mb-6" role="{% if message.error %}alert{% else %}status{% endif %}"><span>{{ message.text }}</span></div>
{%- endif %}
<div class="flex flex-col items-center gap-2">
{%- if let Some(google) = google %}
<form method="post" action="{{ google.action }}">
<input type="hidden" name="return" value="{{ return_to.as_str() }}">
<button class="google cursor-pointer rounded-full" type="submit"><picture><source srcset="{{ google.dark }}" media="(prefers-color-scheme: dark)"><img src="{{ google.light }}" width="180" height="40" alt="Sign in with Google"></picture></button>
</form>
{%- endif %}
{%- if let Some(github) = github %}
<form method="post" action="{{ github.action }}">
<input type="hidden" name="return" value="{{ return_to.as_str() }}">
<button class="github btn" type="submit">{{ github.mark }}Sign in with GitHub</button>
</form>
{%- endif %}
</div>
{%- endblock %}
