{%- import "macros.html" as ui -%}
{%- call ui::new_form(id, "Edit person", crate::buttons::Verb::Save, making.whole()) %}
{%- call(attributes) ui::field(self.field_id(), "Role", making.field(&PersonField::Role), crate::making::Control::Select) %}
<select id="{{ self.field_id() }}" class="select validator w-full" name="role"{{ attributes }}>
{%- for role in linewright_core::access::Role::ALL %}
<option value="{{ role.name() }}"{% if self.chosen(role) %} selected{% endif %}>{{ role.name() }}</option>
{%- endfor %}
</select>
{%- endcall %}
{%- endcall %}
