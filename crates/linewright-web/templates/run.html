{%- extends "layout.html" -%}
{%- import "macros.html" as ui -%}
{%- block main -%}
<div id="run" class="contents">
<p class="verbosity"><a class="inline-flex items-center gap-2" href="{{ switched }}" role="switch" aria-checked="{{ verbose }}"><span class="toggle toggle-sm" aria-checked="{{ verbose }}" aria-hidden="true"></span>verbose</a></p>
{{ capture }}
<section id="transcript" class="transcript" role="log">
{{ transcript|safe }}
</section>
<button id="latest" class="btn btn-sm fixed right-6 bottom-6 shadow-md" type="button" hidden>{% call ui::icon(crate::icons::Icon::ArrowDown, crate::icons::IconSize::Button) %}{% endcall %}Jump to the latest entry</button>
</div>
{%- endblock -%}
