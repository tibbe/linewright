[package]
name = "linewright-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[[example]]
name = "tree-bench"
test = true

[features]
test-utils = ["dep:tower", "tokio/test-util"]

[lints]
workspace = true

[dependencies]
aho-corasick = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
croner = { workspace = true }
dirs = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
globset = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
http-body-util = { workspace = true }
humantime = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
icu_collator = { workspace = true }
icu_normalizer = { workspace = true }
icu_properties = { workspace = true }
jsonschema = { workspace = true }
percent-encoding = { workspace = true }
pulldown-cmark = { workspace = true }
rayon = { workspace = true }
reflink-copy = { workspace = true }
reqwest = { workspace = true }
rustix = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Cargo turns a feature on for a package's own tests only through a
# dev-dependency on the package:
# https://github.com/rust-lang/cargo/issues/2911
linewright-core = { path = ".", features = ["test-utils"] }
proptest = { workspace = true }
remove_dir_all = { workspace = true }
rstest = { workspace = true }
test-log = { workspace = true }
