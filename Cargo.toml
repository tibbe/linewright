[package]
name = "linewright"
version = "0.10.0"
edition = "2024"
description = "A spec-driven software factory: a server that turns spec changes and issues into reviewed, green pull requests."
license = "MIT"
publish = false

# No doc comment holds an example, so there are no doctests to build.
[lib]
doctest = false

# The command, `linewright::COMMAND` (`docs/specs/operation.md`); the package
# and library keep the Linewright name.
[[bin]]
name = "lw"
path = "src/main.rs"

# The store's contracts, run against the local store and, given a sandbox
# repository, GitHub (`tests/contract/main.rs`).
[[test]]
name = "contract"
path = "tests/contract/main.rs"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
format_collect = "allow"
format_push_string = "allow"
get_unwrap = "warn"
if_not_else = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
rest_pat_in_fully_bound_structs = "warn"
shadow_unrelated = "warn"
similar_names = "allow"
single_match_else = "allow"
todo = "warn"
too_many_lines = "allow"
unimplemented = "warn"
used_underscore_binding = "allow"
wildcard_enum_match_arm = "warn"

[dependencies]
aho-corasick = "1"
anyhow = "1"
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8"] }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
croner = "4"
dirs = "7"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false }
globset = "0.4"
hex = "0.4"
hmac = "0.13"
http-body-util = "0.1"
humantime = "2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonschema = { version = "0.60.2", default-features = false }
percent-encoding = "2.3"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rust-embed = { version = "8", features = ["include-exclude"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
serde_yaml_ng = "0.10"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Runs the web UI's script, against stand-ins for the browser and htmx.
boa_engine = { version = "0.22", default-features = false }
# The contract tests' harness: one named trial per contract and store.
libtest-mimic = "0.8"
# Reads the web UI's pages as a reader sees them.
scraper = "0.27"
# Paused time, for the session timeout under the usage limit.
tokio = { version = "1", features = ["test-util"] }
# Drives the router in-process.
tower = { version = "0.5", features = ["util"] }
