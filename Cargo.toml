[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.25.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
format_collect = "allow"
format_push_string = "allow"
get_unwrap = "warn"
if_not_else = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
rest_pat_in_fully_bound_structs = "warn"
shadow_unrelated = "warn"
similar_names = "allow"
single_match_else = "allow"
todo = "warn"
too_many_lines = "allow"
unimplemented = "warn"
used_underscore_binding = "allow"
wildcard_enum_match_arm = "warn"

[workspace.dependencies]
linewright-claude = { path = "crates/linewright-claude" }
linewright-core = { path = "crates/linewright-core" }
linewright-github = { path = "crates/linewright-github" }
linewright-web = { path = "crates/linewright-web" }

aho-corasick = "1"
anyhow = "1"
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8"] }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
base64 = "0.23"
boa_engine = { version = "0.22", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "string"] }
croner = "4"
dirs = "7"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getrandom = "0.4"
globset = "0.4"
hex = "0.4"
hmac = "0.13"
http-body-util = "0.1"
humantime = "2"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
icu_collator = "2.3"
icu_normalizer = "2.3"
icu_properties = "2.3"
jsonschema = { version = "0.61.0", default-features = false }
libtest-mimic = "0.8"
percent-encoding = "2.3"
proptest = "1"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = "1"
reflink-copy = "0.1"
remove_dir_all = { version = "1", features = ["parallel"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-streamable-http-server"] }
rstest = { version = "0.28", default-features = false }
rust-embed = { version = "8", features = ["include-exclude"] }
rustix = { version = "1", features = ["fs", "process"] }
schemars = { version = "1", features = ["chrono04"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
serde_yaml_ng = "0.10"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
test-log = { version = "0.2.21", default-features = false, features = ["trace"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
