[global]
enable = ["MD013"]
exclude = [".agents", ".claude"]

[MD013]
line-length = 80
tables = false
code-blocks = false
reflow = true

# A prompt template's line breaks are the prompt's: a part filled in mid-line
# would break its sentence where the template wrapped. A skill keeps its
# origin's line breaks.
[per-file-ignores]
"briefs/prompts/**" = ["MD013"]
"briefs/plugin/skills/**" = ["MD013"]
