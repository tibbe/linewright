{%- import "macros.html" as ui -%}
{%- call ui::new_form("new-suite", "New suite", "Create", new_suite.refusal) %}
<label class="label" for="new-suite-name">Name</label>
<input id="new-suite-name" class="input w-full" name="name" value="{{ new_suite.fields.name }}" autocomplete="off">
<label class="label" for="new-suite-stage">Stage</label>
<select id="new-suite-stage" class="select w-full" name="stage">
{%- for stage in crate::case::ReplayStage::ALL %}
<option value="{{ stage }}"{% if stage == new_suite.fields.stage %} selected{% endif %}>{{ stage }}</option>
{%- endfor %}
</select>
{%- endcall %}
