{%- extends "layout.html" -%}
{%- import "macros.html" as ui -%}
{%- block main -%}
<h1>Runs</h1>
<form class="narrowing mb-4 flex flex-wrap items-center gap-2" method="get" action="/runs">
<label class="input input-sm w-auto"><span class="label">Item</span><input class="w-16" name="item" inputmode="numeric" value="{{ form.item }}"></label>
<label class="select select-sm w-auto"><span class="label">Stage</span><select name="stage">
<option value="">any</option>
{%- for (stage, chosen) in form.stages %}
<option value="{{ stage }}"{% if chosen %} selected{% endif %}>{{ stage }}</option>
{%- endfor %}
</select></label>
<label class="input input-sm w-auto"><span class="label">Since</span><input class="w-72" name="since" value="{{ form.since }}" placeholder="2h, 2026-10-14 or 2026-10-14T12:00:00Z"></label>
<button class="btn btn-sm btn-primary">Show</button>
</form>
{% block runs -%}
<section id="runs" class="flex min-h-0 flex-1 flex-col">
{%- call ui::runs(runs) %}{% endcall %}
</section>
{%- endblock %}
{%- endblock -%}
