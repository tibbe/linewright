<select id="new-case-run" class="select w-full" name="run" data-region{% if runs.is_empty() %} disabled{% endif %}>
{%- for run in runs %}
<option value="{{ run.id }}" data-name="{{ run.name }}"{% if self.chosen(run.id) %} selected{% endif %}>{{ run.id }}</option>
{%- else %}
<option value="">No runs</option>
{%- endfor %}
</select>
