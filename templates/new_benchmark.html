{%- import "macros.html" as ui -%}
{%- call ui::new_form("new-benchmark", "New benchmark", crate::web::buttons::Verb::Create, new_benchmark.refusal) %}
<label class="label" for="new-benchmark-name">Name</label>
<input id="new-benchmark-name" class="input w-full" name="name" value="{{ new_benchmark.fields.name }}" autocomplete="off">
<label class="label" for="new-benchmark-stage">Stage</label>
<select id="new-benchmark-stage" class="select w-full" name="stage">
{%- for stage in crate::task::TaskStage::ALL %}
<option value="{{ stage }}"{% if stage == new_benchmark.fields.stage %} selected{% endif %}>{{ stage }}</option>
{%- endfor %}
</select>
{%- endcall %}
