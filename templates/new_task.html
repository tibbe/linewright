{%- import "macros.html" as ui -%}
{%- call ui::new_form("new-task", self.title(), crate::web::buttons::Verb::AddTask, making.whole(), region = NEW_TASK_READY, disabled = self.ready().disabled) %}
<label class="label" for="new-task-run">Run</label>
{{ self.runs() }}
<label class="label" for="new-task-name">Name</label>
<input id="new-task-name" class="input w-full" name="name" value="{{ making.fields.name }}" autocomplete="off">
<label class="label" for="new-task-criteria">Criteria</label>
<textarea id="new-task-criteria" class="textarea w-full" name="criteria" rows="6">{{ making.fields.criteria }}</textarea>
{%- endcall %}
