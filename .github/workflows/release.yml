name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - rust-toolchain.toml
      - .github/workflows/release.yml

jobs:
  build:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          load: true
          build-args: LINEWRIGHT_COMMIT=${{ github.sha }}
          tags: linewright:test
      - run: docker run --rm linewright:test --version

  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v$version, the version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          load: true
          build-args: LINEWRIGHT_COMMIT=${{ github.sha }}
          labels: org.opencontainers.image.version=${{ needs.version.outputs.version }}
          tags: linewright:test
      - run: docker run --rm linewright:test --version
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          build-args: LINEWRIGHT_COMMIT=${{ github.sha }}
          labels: org.opencontainers.image.version=${{ needs.version.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/linewright,push-by-digest=true,name-canonical=true,push=true
      - env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ runner.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  merge:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/linewright
          flavor: latest=${{ !contains(github.ref_name, '-') }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY_OWNER/linewright"
          docker buildx imagetools create \
            $(jq -r '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$image@sha256:%s " *)

  binaries:
    needs: version
    if: ${{ !cancelled() && !failure() }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - run: rustup toolchain install && rustup target add "$TARGET"
      - run: cargo build --release --locked --target "$TARGET"
      - run: '"target/$TARGET/release/lw" --version'
      - if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="lw-$VERSION-$TARGET"
          mkdir -p "$RUNNER_TEMP/$name" "$RUNNER_TEMP/binaries"
          cp "target/$TARGET/release/lw" LICENSE "$RUNNER_TEMP/$name"
          cd "$RUNNER_TEMP/binaries"
          tar -czf "$name.tar.gz" -C "$RUNNER_TEMP" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ runner.temp }}/binaries/*
          if-no-files-found: error

  release:
    needs: [merge, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: ${{ runner.temp }}/binaries
      - env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/binaries
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease) \
            ./*
