name: Release

on:
  push:
    tags: ["v*"]

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v$version, the version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          load: true
          build-args: LINEWRIGHT_COMMIT=${{ github.sha }}
          labels: org.opencontainers.image.version=${{ needs.version.outputs.version }}
          tags: linewright:test
      - run: docker run --rm linewright:test --version
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          build-args: LINEWRIGHT_COMMIT=${{ github.sha }}
          labels: org.opencontainers.image.version=${{ needs.version.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/linewright,push-by-digest=true,name-canonical=true,push=true
      - env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ runner.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  merge:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/linewright
          flavor: latest=${{ !contains(github.ref_name, '-') }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY_OWNER/linewright"
          docker buildx imagetools create \
            $(jq -r '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$image@sha256:%s " *)

  binaries:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    needs: [merge, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: ${{ runner.temp }}/binaries
      - env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/binaries
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease) \
            ./*
