name: Docker

# Builds the images when what they are built from changes: the agents cannot
# build images, as they run without a Docker daemon, and the image workflow
# builds only on a release tag. Only pull requests that touch these paths run
# it, so no branch protection may require it: a required check that never
# runs never passes.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - rust-toolchain.toml
      - linewright.toml
      - deploy/**
      - .github/workflows/docker.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The deployment's images, the base image among them. Its `.env` holds
      # the host's secrets, which a build does not read but compose requires.
      - run: touch deploy/.env && docker compose -f deploy/compose.yaml build
