name: Docker

on:
  push:
    branches: [main]

concurrency:
  group: docker-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      LINEWRIGHT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: echo "LINEWRIGHT_TAG=sha-${LINEWRIGHT_COMMIT::7}" >> "$GITHUB_ENV"
      - run: >-
          touch deploy/.env &&
          docker compose -f deploy/compose.yaml -f deploy/compose.build.yaml build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for name in linewright-proxy linewright-self linewright-webhook-relay; do
            image="ghcr.io/tibbe/$name"
            docker tag "$image:$LINEWRIGHT_TAG" "$image:main"
            docker push "$image:$LINEWRIGHT_TAG"
            docker push "$image:main"
          done
