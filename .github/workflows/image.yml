name: Image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - rust-toolchain.toml
      - .github/workflows/image.yml

jobs:
  build:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          load: true
          build-args: LINEWRIGHT_COMMIT=${{ github.sha }}
          tags: linewright:test
      - run: docker run --rm linewright:test --version

  publish:
    if: github.event_name == 'push'
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          load: true
          build-args: LINEWRIGHT_COMMIT=${{ github.sha }}
          tags: linewright:test
      - run: docker run --rm linewright:test --version
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          build-args: LINEWRIGHT_COMMIT=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/linewright,push-by-digest=true,name-canonical=true,push=true
      - env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ runner.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  merge:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY_OWNER/linewright"
          docker buildx imagetools create \
            -t "$image:$GITHUB_REF_NAME" -t "$image:latest" \
            $(printf "$image@sha256:%s " *)
