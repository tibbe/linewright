name: Base image

on:
  workflow_call:

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          load: true
          build-args: LINEWRIGHT_COMMIT=${{ github.sha }}
          tags: linewright:test
      - run: docker run --rm linewright:test --version
