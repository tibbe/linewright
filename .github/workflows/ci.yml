name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    needs: changes
    # Not on a pull request that changes only documentation. The output is
    # empty on a push, which skips `changes`, so the job runs then.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: scripts/check fmt

  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check markdown

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check compose

  css:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check css

  clippy:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/check clippy

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    # The tests take a few minutes; a hung one fails here rather than run
    # for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: scripts/check test
        env:
          NEXTEST_PROFILE: ci

  doc:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/check doc

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base-image: ${{ steps.changes.outputs.base-image }}
      deploy-images: ${{ steps.changes.outputs.deploy-images }}
      binaries: ${{ steps.changes.outputs.binaries }}
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        run: |
          changed() { git diff --quiet HEAD^1 HEAD -- "$@" && echo false || echo true; }
          workflows=.github/workflows
          {
            echo "base-image=$(changed Dockerfile .dockerignore rust-toolchain.toml \
              $workflows/base-image.yml $workflows/release.yml $workflows/ci.yml)"
            echo "deploy-images=$(changed Dockerfile .dockerignore rust-toolchain.toml \
              linewright.toml deploy $workflows/deploy-images.yml $workflows/docker.yml $workflows/ci.yml)"
            echo "binaries=$(changed Cargo.toml Cargo.lock rust-toolchain.toml \
              $workflows/binaries.yml $workflows/release.yml $workflows/ci.yml)"
            # Everything but documentation and the deployment: the briefs,
            # though Markdown, are compiled in.
            echo "rust=$(changed . ':!docs' ':!deploy' ':!.agents' ':!.claude' \
              ':!.linewright' ':(exclude,glob)*.md')"
          } >> "$GITHUB_OUTPUT"

  base-image:
    needs: changes
    if: needs.changes.outputs.base-image == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/base-image.yml

  deploy-images:
    needs: changes
    if: needs.changes.outputs.deploy-images == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-images.yml

  binaries:
    needs: changes
    if: needs.changes.outputs.binaries == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/binaries.yml

  ci:
    if: always()
    needs: [fmt, markdown, compose, css, clippy, test, doc, changes, base-image, deploy-images, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
