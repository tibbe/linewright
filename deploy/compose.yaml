name: linewright

services:
  proxy:
    image: ghcr.io/tibbe/linewright-proxy:${LINEWRIGHT_TAG:-main}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    networks: [fenced, default]

  linewright:
    image: ghcr.io/tibbe/linewright-self:${LINEWRIGHT_TAG:-main}
    restart: unless-stopped
    stop_grace_period: 2h
    env_file: .env
    environment:
      LINEWRIGHT_WORK_DIR: /data
      LINEWRIGHT_UI_ADDRESS: 0.0.0.0:8081
      CLAUDE_CONFIG_DIR: /home/linewright/.claude
      XDG_CACHE_HOME: /tmp/cache
      http_proxy: http://proxy:4750
      https_proxy: http://proxy:4750
      no_proxy: localhost,127.0.0.1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:exec,size=1g
    pids_limit: 1024
    logging:
      driver: json-file
      options: {max-size: 50m, max-file: "3"}
    volumes:
      - data:/data
      - cargo-registry:/usr/local/cargo/registry
      - sccache:/var/cache/sccache
      - rustup:/usr/local/rustup
      - claude-config:/home/linewright/.claude
    depends_on:
      proxy:
        condition: service_started
        restart: true
    networks: [fenced]

  webhook-relay:
    image: ghcr.io/tibbe/linewright-webhook-relay:${LINEWRIGHT_TAG:-main}
    command: ["TCP-LISTEN:8080,fork,reuseaddr", "TCP:linewright:8080"]
    depends_on: [linewright]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    networks:
      fenced:
      npm-proxy:
        aliases: [linewright-webhook]

  ui-relay:
    image: ghcr.io/tibbe/linewright-webhook-relay:${LINEWRIGHT_TAG:-main}
    command: ["TCP-LISTEN:8081,fork,reuseaddr", "TCP:linewright:8081"]
    depends_on: [linewright]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    ports: ["127.0.0.1:8081:8081"]
    networks:
      fenced:
      default:
      npm-proxy:
        aliases: [linewright-ui]

networks:
  fenced:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
  npm-proxy:
    name: proxy
    external: true

volumes:
  data:
  cargo-registry:
  sccache:
  rustup:
  claude-config:
