name: linewright

# The images CI builds from `main` with `compose.build.yaml`, each tagged
# `main` and `sha-` with the commit's first seven characters;
# `LINEWRIGHT_TAG` picks one, `main` by default.
services:
  proxy:
    image: ghcr.io/tibbe/linewright-proxy:${LINEWRIGHT_TAG:-main}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    networks: [fenced, default]

  linewright:
    image: ghcr.io/tibbe/linewright-self:${LINEWRIGHT_TAG:-main}
    restart: unless-stopped
    stop_signal: SIGQUIT
    # Twice the default session-timeout.
    stop_grace_period: 2h
    env_file: .env
    environment:
      LINEWRIGHT_WORK_DIR: /data
      # Answering outside the container, for `ui-relay`.
      LINEWRIGHT_UI_ADDRESS: 0.0.0.0:8081
      CLAUDE_CONFIG_DIR: /home/linewright/.claude
      XDG_CACHE_HOME: /tmp/cache
      http_proxy: http://proxy:4750
      https_proxy: http://proxy:4750
      no_proxy: localhost,127.0.0.1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      # Executable: the agents' builds and tests run files they write there.
      - /tmp:exec,size=1g
    pids_limit: 1024
    logging:
      driver: json-file
      options: {max-size: 50m, max-file: "3"}
    volumes:
      - data:/data
      - cargo-registry:/usr/local/cargo/registry
      - sccache:/var/cache/sccache
      - rustup:/usr/local/rustup
      - claude-config:/home/linewright/.claude
    depends_on: [proxy]
    # Never on `npm-proxy`: the agents must not reach the reverse proxy.
    networks: [fenced]

  # Relays webhook deliveries from the reverse proxy to linewright, which
  # stays on `fenced` alone. It forwards to linewright's default
  # webhook-address, 0.0.0.0:8080, and nowhere else, so it opens no way out
  # of `fenced`.
  webhook-relay:
    image: ghcr.io/tibbe/linewright-webhook-relay:${LINEWRIGHT_TAG:-main}
    command: ["TCP-LISTEN:8080,fork,reuseaddr", "TCP:linewright:8080"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    networks:
      fenced:
      npm-proxy:
        # The name the reverse proxy reaches it by, unique on the shared
        # network.
        aliases: [linewright-webhook]

  # Publishes the web UI on the host's loopback: Docker publishes no port of
  # a container on `fenced` alone, which is internal. It forwards to
  # linewright's ui-address and nowhere else, so it opens no way out of
  # `fenced`.
  ui-relay:
    image: ghcr.io/tibbe/linewright-webhook-relay:${LINEWRIGHT_TAG:-main}
    command: ["TCP-LISTEN:8081,fork,reuseaddr", "TCP:linewright:8081"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    ports: ["127.0.0.1:8081:8081"]
    networks: [fenced, default]

networks:
  fenced:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
  # The Docker network `proxy`, which Nginx Proxy Manager is on, created
  # outside this project.
  npm-proxy:
    name: proxy
    external: true

volumes:
  data:
  cargo-registry:
  sccache:
  rustup:
  claude-config:
