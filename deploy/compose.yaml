name: linewright

services:
  runtime:
    build:
      context: ..
      target: runtime
    image: linewright:runtime
    scale: 0
  base:
    build: ..
    image: linewright:base
    scale: 0

  proxy:
    build:
      # Built from source, as the image Stripe publishes,
      # ghcr.io/stripe/smokescreen, is not public.
      dockerfile_inline: |
        FROM golang:1.26-alpine AS build
        ARG SMOKESCREEN_VERSION=v0.1.0
        RUN CGO_ENABLED=0 go install github.com/stripe/smokescreen@$${SMOKESCREEN_VERSION}
        FROM gcr.io/distroless/static:nonroot
        COPY --from=build /go/bin/smokescreen /smokescreen
        ENTRYPOINT ["/smokescreen"]
    image: linewright:proxy
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    networks: [fenced, default]

  linewright:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      additional_contexts:
        runtime: service:runtime
        base: service:base
    image: linewright:self
    restart: unless-stopped
    env_file: .env
    environment:
      LINEWRIGHT_WORK_DIR: /data
      CLAUDE_CONFIG_DIR: /home/linewright/.claude
      XDG_CACHE_HOME: /tmp/cache
      http_proxy: http://proxy:4750
      https_proxy: http://proxy:4750
      no_proxy: localhost,127.0.0.1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      # Executable: the agents' builds and tests run files they write there.
      - /tmp:exec,size=1g
    pids_limit: 1024
    logging:
      driver: json-file
      options: {max-size: 50m, max-file: "3"}
    volumes:
      - data:/data
      - cargo-registry:/usr/local/cargo/registry
      - sccache:/var/cache/sccache
      - rustup:/usr/local/rustup
      - claude-config:/home/linewright/.claude
    depends_on: [proxy]
    # Never on `npm-proxy`: the agents must not reach the reverse proxy.
    networks: [fenced]

  # Relays webhook deliveries from the reverse proxy to linewright, which
  # stays on `fenced` alone. It forwards to linewright's default
  # webhook-address, 0.0.0.0:8080, and nowhere else, so it opens no way out
  # of `fenced`.
  webhook-relay:
    build:
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache socat
        USER nobody
        ENTRYPOINT ["socat"]
    image: linewright:webhook-relay
    command: ["TCP-LISTEN:8080,fork,reuseaddr", "TCP:linewright:8080"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    networks:
      fenced:
      npm-proxy:
        # The name the reverse proxy reaches it by, unique on the shared
        # network.
        aliases: [linewright-webhook]

networks:
  fenced:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
  # The Docker network `proxy`, which Nginx Proxy Manager is on, created
  # outside this project.
  npm-proxy:
    name: proxy
    external: true

volumes:
  data:
  cargo-registry:
  sccache:
  rustup:
  claude-config:
