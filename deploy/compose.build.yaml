x-labels: &labels
  org.opencontainers.image.source: https://github.com/tibbe/linewright
  org.opencontainers.image.revision: ${LINEWRIGHT_COMMIT:?the commit the images are built from}

x-user: &user
  LINEWRIGHT_UID: "10001"
  LINEWRIGHT_GID: "100"

services:
  runtime:
    build:
      context: ..
      target: runtime
      args: *user
    image: linewright:runtime
    scale: 0
  base:
    build:
      context: ..
      args:
        <<: *user
        LINEWRIGHT_COMMIT: ${LINEWRIGHT_COMMIT:?the commit the images are built from}
    image: linewright:base
    scale: 0

  proxy:
    build:
      dockerfile_inline: |
        FROM golang:1.26-alpine AS build
        ARG SMOKESCREEN_VERSION=v0.1.0
        RUN CGO_ENABLED=0 go install github.com/stripe/smokescreen@$${SMOKESCREEN_VERSION}
        FROM gcr.io/distroless/static:nonroot
        COPY --from=build /go/bin/smokescreen /smokescreen
        ENTRYPOINT ["/smokescreen"]
      labels: *labels

  linewright:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      additional_contexts:
        runtime: service:runtime
        base: service:base
      labels: *labels

  webhook-relay:
    build:
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache socat
        USER nobody
        ENTRYPOINT ["socat"]
      labels: *labels
